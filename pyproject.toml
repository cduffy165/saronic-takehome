[project]
name = "app-factory"
version = "0.1.0"
description = "Internal application factory: plan, build, review, and register small internal apps."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "streamlit>=1.40",
    "pyyaml>=6.0.3",
    "authlib>=1.3.2",
    "claude-agent-sdk>=0.2.144",
    "httpx>=0.27",
    "docker>=7.2.0",
    "pyjwt[crypto]>=2.13.0",
    "bandit>=1.9.4",
    # Also used by factory/agents/static_analysis.py as a runtime static-analysis
    # tool against generated apps (its "S" ruleset), not only for linting our
    # own code — a genuine product dependency, same category as bandit above.
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
