cases:
  - id: proceed_greenfield_small_app
    requester_sub: 11111111-1111-1111-1111-111111111111 # alice
    opening_message: >
      I need a small internal app to log office supply requests. Fields: item_name
      (text), quantity (number), requester (text), status (text, defaults to
      requested). Only the office manager edits status; requesters just submit.
      One list view filterable by status, one submit form. No auth beyond what
      the platform already provides, no external integrations, no notifications,
      single team.
    answers:
      finalize: Yes, please finalize now — you have everything you need.
    fallback_reply: That's fine as described — please finalize the plan now.
    expected_outcome: proceed

