services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 18+'s official image switched conventions: it now expects a single
      # mount at /var/lib/postgresql and manages a version-named subdirectory
      # under it itself (pg_ctlcluster-style), rather than the old
      # /var/lib/postgresql/data mount — mounting the old path makes the
      # image refuse to start, since it finds data sitting at the "wrong"
      # location for how 18+ expects to manage upgrades.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Pinning the issuer to one hostname makes it resolvable identically from the
      # browser (via *.localhost auto-loopback, see README) and from the ui
      # container (via the extra_hosts host-gateway mapping below) — otherwise the
      # browser would see "localhost" and the container "keycloak", and OIDC
      # discovery/issuer validation would fail on the mismatch.
      KC_HOSTNAME: auth.localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      # Not loopback-only, unlike postgres above: the ui container reaches this
      # port via the host-gateway (extra_hosts, below), which arrives as a
      # regular external connection, not through the loopback interface.
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitea:
    image: gitea/gitea:1.27.1-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
    volumes:
      # The rootless image runs as a fixed "git" user (uid 1000) and keeps its
      # data under /var/lib/gitea, not /data (that's the classic image's
      # path) — mounting the wrong one silently loses all data on every
      # container recreation instead of erroring.
      - gitea-data:/var/lib/gitea
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-factory}@postgres:5432/${POSTGRES_DB:-factory}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env — required to run the Plan session}
      GITEA_URL: http://gitea:3000
      GITEA_USERNAME: factory
      # Not a hard-required var like ANTHROPIC_API_KEY above: generating this
      # token requires gitea to be running first (`make gitea-init`), so
      # requiring it up front would make it impossible to ever start gitea.
      # Empty is fine until the first Build/Register — that's where a missing
      # token surfaces as a real, actionable error.
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Generated containers are LLM-authored and only checked by a static
      # secrets scan + a tool-less LLM review — neither evaluates runtime
      # network behavior. They're attached to a *separate* network with no
      # route to postgres/keycloak, not the one those services run on;
      # api sits on both so it can still reach a generated container by
      # internal IP for health checks — see factory/agents/container_runtime.py.
      FACTORY_NETWORK: factory-generated-net
    networks:
      - default
      - generated-apps
    extra_hosts:
      # api needs to verify Keycloak-issued bearer tokens against the JWKS
      # endpoint — same issuer-hostname reasoning as ui's mapping below.
      - "auth.localhost:host-gateway"
    volumes:
      # Build's working tree and the Docker build context — real files on the
      # host (bind mount, not a named volume), so they're inspectable even
      # before a push succeeds. The durable, clonable copy lives in Gitea;
      # this directory is the local checkout the pipeline operates on.
      - ./generated_apps:/app/generated_apps
      # Deterministic build/run of generated apps talks to the HOST's docker
      # daemon over this socket (factory/agents/container_runtime.py) — an LLM
      # never gets shell/docker access; only our own code does.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-factory}@postgres:5432/${POSTGRES_DB:-factory}
    extra_hosts:
      # Makes "auth.localhost" resolve, from inside this container, to the host
      # machine — landing back on Keycloak's published port. Pairs with
      # KC_HOSTNAME above so the issuer is identical from the browser and here.
      - "auth.localhost:host-gateway"
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  gitea-data:

networks:
  default:
    # Named explicitly (rather than the project-name-derived default) for a
    # stable, known name. Trusted services only — postgres, keycloak, api, ui.
    name: factory-net
  generated-apps:
    # Untrusted, LLM-generated containers live here, isolated from postgres
    # and keycloak. Only api bridges both networks.
    name: factory-generated-net
